<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Employee Dashboard</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Welcome, <span th:text="${user.name}"></span></h2>
    <a href="/logout" class="btn btn-danger">Logout</a>
  </div>

  <div class="card p-3 mb-4 bg-light shadow-sm">
    <h5>Today's Status: 
      <span class="badge bg-primary" th:text="${today != null ? today.status : 'NOT MARKED'}"></span>
    </h5>
    <p class="mb-2">Leaves Deducted: <b class="text-danger" th:text="${user.leavesTaken}"></b> / 18</p>
    
    <div class="d-flex gap-2 mt-3">
      <!-- Check-In Button -->
      <form action="/checkin" method="post">
        <button class="btn btn-success" th:disabled="${today != null}">Check-In</button>
      </form>
      
      <!-- Check-Out Button -->
      <form action="/checkout" method="post">
        <button class="btn btn-warning" th:disabled="${today == null or today.checkOut != null}">Check-Out</button>
      </form>
    </div>
  </div>

  <h4>Your Attendance History</h4>
  <table class="table table-bordered table-hover mt-3">
    <thead class="table-dark">
      <tr>
        <th>Date</th>
        <th>Check-In</th>
        <th>Check-Out</th>
        <th>Working Minutes</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="a : ${history}">
        <td th:text="${a.date}"></td>
        <td th:text="${a.checkIn}"></td>
        <td th:text="${a.checkOut}"></td>
        <td th:text="${a.workingHours} + ' mins'"></td>
        <td>
          <span class="badge" 
                th:classappend="${a.status == 'PRESENT' ? 'bg-success' : (a.status == 'HALF_DAY' ? 'bg-warning' : 'bg-danger')}" 
                th:text="${a.status}">
          </span>
        </td>
      </tr>
    </tbody>
  </table>
</body>
</html>
