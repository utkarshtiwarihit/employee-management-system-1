<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>HR Management Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-8">
    <div class="max-w-6xl mx-auto space-y-6">
        <!-- Header -->
        <header class="flex justify-between items-center bg-slate-900 border border-slate-800 p-6 rounded-2xl">
            <div>
                <h1 class="text-xl font-bold">HR Workspace Dashboard</h1>
                <p class="text-sm text-slate-400" th:text="${user.name} + ' (Admin)'"></p>
            </div>
            <a href="/logout" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-xl text-sm transition">Sign out</a>
        </header>

        <!-- Stats Overview -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="p-6 bg-slate-900 border border-slate-800 rounded-2xl">
                <p class="text-xs uppercase tracking-wider text-slate-400">Total Staff</p>
                <p class="text-3xl font-bold mt-2 text-indigo-400" th:text="${totalStaff}">0</p>
            </div>
            <div class="p-6 bg-slate-900 border border-slate-800 rounded-2xl">
                <p class="text-xs uppercase tracking-wider text-slate-400">Present Today</p>
                <p class="text-3xl font-bold mt-2 text-emerald-400" th:text="${presentToday}">0</p>
            </div>
        </div>

        <!-- Add Employee Form -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6">
            <h2 class="text-lg font-semibold mb-4 text-slate-200">Add New Employee</h2>
            <form action="/hr/add-employee" method="post" class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <div>
                    <label class="text-xs uppercase tracking-wider text-slate-400">Full Name</label>
                    <input type="text" name="name" required placeholder="e.g. John Doe"
                           class="w-full mt-1.5 px-4 py-2.5 bg-slate-800 border border-slate-700 rounded-xl text-white focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="text-xs uppercase tracking-wider text-slate-400">Designation</label>
                    <input type="text" name="designation" required placeholder="e.g. Software Engineer"
                           class="w-full mt-1.5 px-4 py-2.5 bg-slate-800 border border-slate-700 rounded-xl text-white focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="text-xs uppercase tracking-wider text-slate-400">Email</label>
                    <input type="email" name="email" required placeholder="name@company.com"
                           class="w-full mt-1.5 px-4 py-2.5 bg-slate-800 border border-slate-700 rounded-xl text-white focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="text-xs uppercase tracking-wider text-slate-400">Password</label>
                    <input type="password" name="password" required placeholder="••••••••"
                           class="w-full mt-1.5 px-4 py-2.5 bg-slate-800 border border-slate-700 rounded-xl text-white focus:outline-none focus:border-indigo-500">
                </div>
                <div class="md:col-span-4 flex justify-end">
                    <button type="submit" class="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-medium rounded-xl shadow-lg shadow-indigo-600/30 transition">
                        + Create Employee
                    </button>
                </div>
            </form>
        </div>

        <!-- Registered Employees Table -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6">
            <h2 class="text-lg font-semibold mb-4 text-slate-200">Registered Staff</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm">
                    <thead class="text-slate-500 border-b border-slate-800">
                        <tr>
                            <th class="pb-3">ID</th>
                            <th class="pb-3">Name</th>
                            <th class="pb-3">Designation</th>
                            <th class="pb-3">Email</th>
                            <th class="pb-3">Role</th>
                            <th class="pb-3">Leaves Taken</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-800/50">
                        <tr th:each="emp : ${employees}" class="hover:bg-slate-800/30">
                            <td class="py-3.5 text-slate-400" th:text="${emp.id}"></td>
                            <td class="py-3.5 font-medium text-slate-200" th:text="${emp.name}"></td>
                            <td class="py-3.5 text-slate-400" th:text="${emp.designation}"></td>
                            <td class="py-3.5 text-slate-400" th:text="${emp.email}"></td>
                            <td class="py-3.5">
                                <span th:class="${emp.role == 'HR' ? 'text-purple-400 bg-purple-500/10 border-purple-500/20' : 'text-blue-400 bg-blue-500/10 border-blue-500/20'} + ' px-2.5 py-1 text-xs border rounded-md font-medium'"
                                      th:text="${emp.role}">
                                </span>
                            </td>
                            <td class="py-3.5 text-amber-400 font-medium" th:text="${emp.leavesTaken != null ? emp.leavesTaken : 0.0} + ' d'"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Live Attendance Feed -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6">
            <h2 class="text-lg font-semibold mb-4 text-slate-200">Live Attendance Records</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm">
                    <thead class="text-slate-500 border-b border-slate-800">
                        <tr>
                            <th class="pb-3">Employee</th>
                            <th class="pb-3">Date</th>
                            <th class="pb-3">In</th>
                            <th class="pb-3">Out</th>
                            <th class="pb-3">Status</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-800/50">
                        <tr th:each="att : ${attendances}" class="hover:bg-slate-800/30">
                            <td class="py-3.5 font-medium" th:text="${att.user.name}"></td>
                            <td class="py-3.5 text-slate-400" th:text="${att.date}"></td>
                            <td class="py-3.5 text-slate-200" th:text="${att.checkInTime}">--</td>
                            <td class="py-3.5 text-slate-200" th:text="${att.checkOutTime != null ? att.checkOutTime : '--'}">--</td>
                            <td class="py-3.5">
                                <span th:class="${att.status == 'COMPLETED' ? 'text-emerald-400 bg-emerald-500/10 border-emerald-500/20' : 'text-indigo-400 bg-indigo-500/10 border-indigo-500/20'} + ' px-2.5 py-1 text-xs border rounded-md font-medium'"
                                      th:text="${att.status}">
                                </span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
