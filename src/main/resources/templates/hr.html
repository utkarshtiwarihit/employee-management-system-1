<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>HR Dashboard</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>HR Management Dashboard</h2>
    <a href="/logout" class="btn btn-danger">Logout</a>
  </div>

  <!-- New Employee Registration Form -->
  <div class="card p-4 mb-4 shadow-sm">
    <h4 class="card-title text-primary mb-3">Add New Employee</h4>
    <form action="/hr/add-employee" method="post" class="row g-3">
      <div class="col-md-3">
        <label class="form-label">Full Name</label>
        <input type="text" name="name" class="form-control" placeholder="e.g. John Doe" required>
      </div>
      <div class="col-md-3">
        <label class="form-label">Designation</label>
        <input type="text" name="designation" class="form-control" placeholder="e.g. Software Engineer" required>
      </div>
      <div class="col-md-3">
        <label class="form-label">Email</label>
        <input type="email" name="email" class="form-control" placeholder="e.g. john@company.com" required>
      </div>
      <div class="col-md-3">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" placeholder="Enter password" required>
      </div>
      <div class="col-12 text-end">
        <button type="submit" class="btn btn-primary px-4">Create Employee</button>
      </div>
    </form>
  </div>

  <!-- Registered Employees Table -->
  <div class="card p-3 mb-4 shadow-sm">
    <h4 class="card-title mb-3">Registered Employees</h4>
    <table class="table table-bordered table-striped">
      <thead class="table-dark">
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Designation</th>
          <th>Email</th>
          <th>Role</th>
          <th>Leaves Taken</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="emp : ${employees}">
          <td th:text="${emp.id}"></td>
          <td th:text="${emp.name}"></td>
          <td th:text="${emp.designation != null ? emp.designation : '-'}"></td>
          <td th:text="${emp.email}"></td>
          <td th:text="${emp.role}"></td>
          <td th:text="${emp.leavesTaken}"></td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Attendance History Table -->
  <div class="card p-3 shadow-sm">
    <h4 class="card-title mb-3">All Attendance Logs</h4>
    <table class="table table-bordered table-hover">
      <thead class="table-dark">
        <tr>
          <th>Record ID</th>
          <th>User ID</th>
          <th>Date</th>
          <th>Check-In</th>
          <th>Check-Out</th>
          <th>Working Minutes</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="r : ${records}">
          <td th:text="${r.id}"></td>
          <td th:text="${r.userId}"></td>
          <td th:text="${r.date}"></td>
          <td th:text="${r.checkIn}"></td>
          <td th:text="${r.checkOut}"></td>
          <td th:text="${r.workingHours} + ' mins'"></td>
          <td>
            <span class="badge" 
                  th:classappend="${r.status == 'PRESENT' ? 'bg-success' : (r.status == 'HALF_DAY' ? 'bg-warning' : 'bg-danger')}" 
                  th:text="${r.status}">
            </span>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</body>
</html>
