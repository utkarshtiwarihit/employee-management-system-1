<!DOCTYPE html>
<html>
<head><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"></head>
<body class="d-flex align-items-center vh-100 bg-light">
  <div class="card p-4 mx-auto shadow" style="width: 350px;">
    <h4 class="text-center mb-3">System Login</h4>
    <form action="/login" method="post">
      <input type="email" name="email" class="form-control mb-2" placeholder="Email" required>
      <input type="password" name="password" class="form-control mb-3" placeholder="Password" required>
      <button class="btn btn-primary w-100">Login</button>
    </form>
  </div>
</body>
</html>
