<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>AttendFlow - Modern Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 flex items-center justify-center min-h-screen">
    <div class="w-full max-w-md p-8 bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl">
        <div class="text-center mb-8">
            <div class="inline-block p-3 bg-indigo-600/20 text-indigo-400 rounded-xl mb-3">⚡</div>
            <h1 class="text-2xl font-bold tracking-tight">AttendFlow HR</h1>
            <p class="text-slate-400 text-sm mt-1">Smart Attendance & Workforce Suite</p>
        </div>

        <div th:if="${param.error}" class="p-3 mb-4 text-sm text-red-400 bg-red-950/50 border border-red-800 rounded-lg">
            Invalid credentials. Please verify case and password.
        </div>

        <form action="/login" method="post" class="space-y-4">
            <div>
                <label class="text-xs uppercase tracking-wider text-slate-400">Email Address</label>
                <input type="email" name="email" required placeholder="name@company.com" 
                       class="w-full mt-1.5 px-4 py-3 bg-slate-800 border border-slate-700 rounded-xl text-white focus:outline-none focus:border-indigo-500 transition">
            </div>
            <div>
                <label class="text-xs uppercase tracking-wider text-slate-400">Password</label>
                <input type="password" name="password" required placeholder="••••••••" 
                       class="w-full mt-1.5 px-4 py-3 bg-slate-800 border border-slate-700 rounded-xl text-white focus:outline-none focus:border-indigo-500 transition">
            </div>
            <button type="submit" class="w-full py-3 mt-2 bg-indigo-600 hover:bg-indigo-500 text-white font-medium rounded-xl transition shadow-lg shadow-indigo-600/30">
                Sign In to Workspace
            </button>
        </form>
    </div>
</body>
</html>
